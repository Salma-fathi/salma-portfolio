<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Healthcare SQL insights illustration</title>
  <desc id="desc">Hospital analytics dashboard with readmission risk score and patient distribution chart.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#052e16"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect x="52" y="58" width="696" height="384" rx="24" fill="#0f172a" opacity="0.55"/>
  <rect x="96" y="96" width="268" height="260" rx="16" fill="#1e293b"/>
  <rect x="126" y="130" width="208" height="40" rx="10" fill="#0ea5a3" opacity="0.85"/>
  <text x="140" y="158" fill="#ecfeff" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="600">Readmission Risk</text>
  <text x="140" y="235" fill="#99f6e4" font-family="Inter, Arial, sans-serif" font-size="64" font-weight="700">18%</text>
  <rect x="402" y="96" width="302" height="260" rx="16" fill="#1e293b"/>
  <g fill="#5eead4">
    <rect x="438" y="274" width="36" height="60" rx="6"/>
    <rect x="492" y="236" width="36" height="98" rx="6"/>
    <rect x="546" y="205" width="36" height="129" rx="6"/>
    <rect x="600" y="250" width="36" height="84" rx="6"/>
    <rect x="654" y="218" width="36" height="116" rx="6"/>
  </g>
  <path d="M438 180 L492 160 L546 145 L600 152 L654 138" stroke="#99f6e4" stroke-width="7" fill="none" stroke-linecap="round"/>
  <text x="430" y="136" fill="#ccfbf1" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="600">130 Hospitals</text>
</svg>
