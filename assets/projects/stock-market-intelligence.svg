<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Stock market intelligence dashboard illustration</title>
  <desc id="desc">Stylized finance dashboard with line chart, candlesticks, and portfolio metrics.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect x="40" y="50" width="520" height="320" rx="20" fill="#0b1229" opacity="0.55"/>
  <path d="M90 300 L180 250 L270 275 L360 210 L450 240 L530 170" fill="none" stroke="url(#line)" stroke-width="10" stroke-linecap="round"/>
  <g fill="#4ade80" opacity="0.9">
    <rect x="90" y="210" width="26" height="90" rx="6"/>
    <rect x="160" y="180" width="26" height="120" rx="6"/>
    <rect x="230" y="230" width="26" height="70" rx="6"/>
    <rect x="300" y="150" width="26" height="150" rx="6"/>
  </g>
  <rect x="600" y="80" width="160" height="120" rx="14" fill="#1e293b"/>
  <text x="620" y="125" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="22">Sharpe</text>
  <text x="620" y="160" fill="#22d3ee" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="700">1.225</text>
  <rect x="600" y="220" width="160" height="120" rx="14" fill="#1e293b"/>
  <text x="620" y="270" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="22">Risk</text>
  <text x="620" y="305" fill="#a7f3d0" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">Low</text>
</svg>
