<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Olist RFM and retention dashboard illustration</title>
  <desc id="desc">Heatmap matrix and retention cohort curves for e-commerce customer analysis.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect x="46" y="58" width="708" height="384" rx="24" fill="#111827" opacity="0.55"/>
  <rect x="90" y="96" width="290" height="290" rx="16" fill="#1f2937"/>
  <g>
    <rect x="120" y="126" width="70" height="70" fill="#1d4ed8"/>
    <rect x="200" y="126" width="70" height="70" fill="#2563eb"/>
    <rect x="280" y="126" width="70" height="70" fill="#3b82f6"/>
    <rect x="120" y="206" width="70" height="70" fill="#0891b2"/>
    <rect x="200" y="206" width="70" height="70" fill="#0ea5e9"/>
    <rect x="280" y="206" width="70" height="70" fill="#22d3ee"/>
    <rect x="120" y="286" width="70" height="70" fill="#4f46e5"/>
    <rect x="200" y="286" width="70" height="70" fill="#6366f1"/>
    <rect x="280" y="286" width="70" height="70" fill="#818cf8"/>
  </g>
  <rect x="430" y="96" width="280" height="290" rx="16" fill="#1f2937"/>
  <path d="M460 320 C510 220, 560 210, 610 180 S680 140, 700 120" stroke="#34d399" stroke-width="9" fill="none" stroke-linecap="round"/>
  <path d="M460 330 C510 280, 560 265, 610 250 S680 235, 700 225" stroke="#fbbf24" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.9"/>
  <text x="466" y="145" fill="#d1fae5" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="600">Retention Cohorts</text>
  <text x="466" y="180" fill="#86efac" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">3.12%</text>
